<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>ft_transcendence</title>
	<link rel="icon" href="./favicon/favicon.ico" type="image/x-icon">
	<link href="./src/style.css" rel="stylesheet">
	<style>
		/* Animations */
		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}
		
		@keyframes slideUp {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}
		
		@keyframes slideInRight {
			from { opacity: 0; transform: translateX(100%); }
			to { opacity: 1; transform: translateX(0); }
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		
		@keyframes pulse {
			0%, 60%, 100% {
				transform: scale(0.8);
				opacity: 0.5;
			}
			30% {
				transform: scale(1);
				opacity: 1;
			}
		}

		/* Utility classes */
		.fade-in { animation: fadeIn 0.5s ease-in; }
		.slide-up { animation: slideUp 0.3s ease-out; }
		.notification { animation: slideInRight 0.3s ease-out; }
		.message-enter { animation: slideUp 0.3s ease-out; }
		
		.card-hover {
			transition: transform 0.2s ease-in-out;
		}
		.card-hover:hover {
			transform: translateY(-2px);
		}

		.loading-spinner {
			width: 20px;
			height: 20px;
			border: 2px solid #e2e8f0;
			border-top: 2px solid #3b82f6;
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		/* Page transitions */
		.page-transition {
			transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
		}
		
		.page-enter {
			opacity: 0;
			transform: translateY(20px);
		}
		
		.page-exit {
			opacity: 0;
			transform: translateY(-20px);
		}

		/* Typing indicator */
		.typing-indicator {
			display: inline-block;
			width: 20px;
			height: 20px;
			border-radius: 50%;
			background-color: #94a3b8;
			opacity: 0.6;
			animation: pulse 1.5s ease-in-out infinite;
		}
		
		.typing-indicator:nth-child(2) { animation-delay: 0.3s; }
		.typing-indicator:nth-child(3) { animation-delay: 0.6s; }

		/* Hide scrollbar */
		.hide-scrollbar {
			-ms-overflow-style: none;
			scrollbar-width: none;
		}
		.hide-scrollbar::-webkit-scrollbar {
			display: none;
		}

		/* Fixed notifications container */
		#notifications {
			position: fixed;
			top: 1rem;
			right: 1rem;
			z-index: 9999;
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			max-width: 24rem;
			width: 100%;
			pointer-events: none;
		}

		/* Notification styling */
		.notification-item {
			background: rgba(30, 41, 59, 0.95);
			border: 1px solid rgba(71, 85, 105, 0.5);
			border-radius: 0.5rem;
			padding: 1rem;
			color: white;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
			backdrop-filter: blur(10px);
			pointer-events: auto;
			min-height: 3rem;
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		.notification-success {
			border-left: 4px solid #10b981;
		}

		.notification-error {
			border-left: 4px solid #ef4444;
		}

		.notification-info {
			border-left: 4px solid #3b82f6;
		}

		.notification-warning {
			border-left: 4px solid #f59e0b;
		}
	</style>
</head>
<body class="bg-slate-900 text-white font-BitcountGridDouble m-0 p-0">
	<div id="app" class="min-h-screen">
		<!-- Game Canvas -->
		<canvas id="gameCanvas" class="hidden absolute inset-0 w-full h-full z-0"></canvas>
		
		<!-- Main Content -->
		<div id="main-content" class="min-h-screen page-transition">
			<!-- Content loaded dynamically -->
		</div>
	</div>

	<!-- Game Options Modal -->
	<div id="modalOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
		<div class="bg-slate-800 rounded-lg p-6 max-w-md w-full mx-4 relative">
			<button id="closeButton" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
				<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
				</svg>
			</button>
			<h3 class="text-xl font-bold text-white mb-6">Game Options</h3>
			<div class="space-y-3">
				<button data-game-mode="solo-ai" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-4 rounded-lg flex items-center justify-between transition-colors duration-200 group">
					<div class="flex items-center">
						<div class="bg-blue-600 p-2 rounded-lg mr-3">
							<svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
								<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
							</svg>
						</div>
						<span class="font-medium">Solo vs Computer (AI)</span>
					</div>
					<svg class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
					</svg>
				</button>
				<button data-game-mode="multiplayer-local" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-4 rounded-lg flex items-center justify-between transition-colors duration-200 group">
					<div class="flex items-center">
						<div class="bg-green-600 p-2 rounded-lg mr-3">
							<svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
								<path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
							</svg>
						</div>
						<span class="font-medium">Multiplayer Local</span>
					</div>
					<svg class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
					</svg>
				</button>
				<button data-game-mode="settings" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-4 rounded-lg flex items-center justify-between transition-colors duration-200 group">
					<div class="flex items-center">
						<div class="bg-gray-600 p-2 rounded-lg mr-3">
							<svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
								<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
								<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
							</svg>
						</div>
						<span class="font-medium">Game Settings</span>
					</div>
					<svg class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
					</svg>
				</button>
			</div>
		</div>
	</div>

	<!-- Game Invite Modal -->
	<div id="gameInviteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
		<div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 max-w-md w-full mx-4">
			<h3 class="text-xl font-bold text-white mb-4">🎮 Game Invite</h3>
			<p id="gameInviteText" class="text-gray-300 mb-6"></p>
			<div class="flex space-x-3">
				<button id="acceptInviteBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg font-medium transition-colors">
					Accept
				</button>
				<button id="declineInviteBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg font-medium transition-colors">
					Decline
				</button>
			</div>
		</div>
	</div>

	<!-- Notifications Container -->
	<div id="notifications"></div>

	<script type="module" src="src/main.ts"></script>
</body>
</html>
