<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>ft_transcendence</title>
	<link rel="icon" href="./favicon/favicon.ico" type="image/x-icon">
	<link href="./src/style.css" rel="stylesheet">
	<style>
		/* Animations */
		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}
		
		@keyframes slideUp {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}
		
		@keyframes slideInRight {
			from { opacity: 0; transform: translateX(100%); }
			to { opacity: 1; transform: translateX(0); }
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		
		@keyframes pulse {
			0%, 60%, 100% {
				transform: scale(0.8);
				opacity: 0.5;
			}
			30% {
				transform: scale(1);
				opacity: 1;
			}
		}

		/* Utility classes */
		.fade-in { animation: fadeIn 0.5s ease-in; }
		.slide-up { animation: slideUp 0.3s ease-out; }
		.notification { animation: slideInRight 0.3s ease-out; }
		.message-enter { animation: slideUp 0.3s ease-out; }
		
		.card-hover {
			transition: transform 0.2s ease-in-out;
		}
		.card-hover:hover {
			transform: translateY(-2px);
		}

		.loading-spinner {
			width: 20px;
			height: 20px;
			border: 2px solid #e2e8f0;
			border-top: 2px solid #3b82f6;
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		/* Page transitions */
		.page-transition {
			transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
		}
		
		.page-enter {
			opacity: 0;
			transform: translateY(20px);
		}
		
		.page-exit {
			opacity: 0;
			transform: translateY(-20px);
		}

		/* Typing indicator */
		.typing-indicator {
			display: inline-block;
			width: 20px;
			height: 20px;
			border-radius: 50%;
			background-color: #94a3b8;
			opacity: 0.6;
			animation: pulse 1.5s ease-in-out infinite;
		}
		
		.typing-indicator:nth-child(2) { animation-delay: 0.3s; }
		.typing-indicator:nth-child(3) { animation-delay: 0.6s; }

		/* Hide scrollbar */
		.hide-scrollbar {
			-ms-overflow-style: none;
			scrollbar-width: none;
		}
		.hide-scrollbar::-webkit-scrollbar {
			display: none;
		}

		/* Fixed notifications container */
		#notifications {
			position: fixed;
			top: 1rem;
			right: 1rem;
			z-index: 9999;
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			max-width: 24rem;
			width: 100%;
			pointer-events: none;
		}

		/* Notification styling */
		.notification-item {
			background: rgba(30, 41, 59, 0.95);
			border: 1px solid rgba(71, 85, 105, 0.5);
			border-radius: 0.5rem;
			padding: 1rem;
			color: white;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
			backdrop-filter: blur(10px);
			pointer-events: auto;
			min-height: 3rem;
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		.notification-success {
			border-left: 4px solid #10b981;
		}

		.notification-error {
			border-left: 4px solid #ef4444;
		}

		.notification-info {
			border-left: 4px solid #3b82f6;
		}

		.notification-warning {
			border-left: 4px solid #f59e0b;
		}
		#gameCanvas {
			width: 100% !important;
			height: 100% !important;
			display: block;
		}
	</style>
</head>
<body class="bg-slate-900 text-white font-BitcountGridDouble m-0 p-0">
	<div id="app" class="min-h-screen">
		<!-- Main Content -->
		<div id="main-content" class="min-h-screen page-transition">
			<!-- Content loaded dynamically -->
		</div>
	</div>
	<!-- Notifications Container -->
	<div id="notifications"></div>

	<script type="module" src="src/main.ts"></script>
</body>
</html>
